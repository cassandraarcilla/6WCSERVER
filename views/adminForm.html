<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Form</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="form-container">
    <h2>Admin Form</h2>

    <!-- Navigation Buttons -->
    <div class="nav-buttons" style="margin-bottom: 20px;">
      <button onclick="location.href='/adminForm'">Admin</button>
      <button onclick="location.href='/home'">Home</button>
      <button onclick="location.href='/studentForm'">Student</button>
    </div>

    <!-- Admin form for submitting admin details and uploading file -->
    <form action="/upload" method="POST" enctype="multipart/form-data">
      <input type="text" name="adminID" placeholder="Admin ID" required />
      <input type="text" name="firstName" placeholder="First Name" required />
      <input type="text" name="lastName" placeholder="Last Name" required />
      <input type="text" name="department" placeholder="Department" required />
      <input type="text" name="username" placeholder="Username" required />
      <input type="file" name="file" required />
      <button type="submit">Submit</button>
    </form>
  </div>
</body>
</html>
